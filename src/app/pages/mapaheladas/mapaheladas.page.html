<ng-template #innerContent>
  <div class="wrap">

    <div class="topControls">
      <div class="screenTitle" *ngIf="!embedded">MAPA DE HELADAS</div>

      <ion-segment [(ngModel)]="modo" (ionChange)="onModoChange()" class="seg">
        <ion-segment-button value="dia">
          <ion-label>Día</ion-label>
        </ion-segment-button>
        <ion-segment-button value="mes">
          <ion-label>Mes</ion-label>
        </ion-segment-button>
        <ion-segment-button value="anio">
          <ion-label>Año</ion-label>
        </ion-segment-button>
      </ion-segment>

      <ion-segment *ngIf="modo==='anio'" [(ngModel)]="anioSeleccionado" (ionChange)="redibujarAnio()" class="segYear">
        <ion-segment-button [value]="anioActual">
          <ion-label>{{ anioActual }}</ion-label>
        </ion-segment-button>
        <ion-segment-button [value]="anioAnterior">
          <ion-label>{{ anioAnterior }}</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>

    <div id="mapHeladas"></div>

    <div class="legend" [class.legend--collapsed]="!legendAbierta">
      <button class="legendToggle" (click)="legendAbierta = !legendAbierta">
        <span>Referencias</span>
        <ion-icon [name]="legendAbierta ? 'chevron-down-outline' : 'chevron-up-outline'"></ion-icon>
      </button>

      <div class="legendBody" *ngIf="legendAbierta">
        <div class="legendTitle">Criterio (T mínima)</div>

        <div class="legendRow">
          <span class="dot d0"></span>
          <span>Sin helada (&gt; 0°C)</span>
        </div>
        <div class="legendRow">
          <span class="dot d1"></span>
          <span>Helada suave (0 a -2°C)</span>
        </div>
        <div class="legendRow">
          <span class="dot d2"></span>
          <span>Helada moderada (-2 a -4°C)</span>
        </div>
        <div class="legendRow">
          <span class="dot d3"></span>
          <span>Helada severa (-4 a -6°C)</span>
        </div>
        <div class="legendRow">
          <span class="dot d4"></span>
          <span>Helada muy severa (&le; -6°C)</span>
        </div>
        <div class="legendRow">
          <span class="dot dSD"></span>
          <span>Sin dato</span>
        </div>

        <div class="legendHint">
          Tocá un punto para ver detalle. Acercá el mapa para ver los valores.
        </div>
      </div>
    </div>

  </div>
</ng-template>

<ion-content *ngIf="!embedded" class="contenido" [fullscreen]="true">
  <ng-container *ngTemplateOutlet="innerContent"></ng-container>
</ion-content>

<div *ngIf="embedded" class="mapEmbed">
  <ng-container *ngTemplateOutlet="innerContent"></ng-container>
</div>
