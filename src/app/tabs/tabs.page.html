<div class="app-top-strip">

  <div class="brand-row">
    <div class="brand-spacer"></div>

    <div class="brand-logo">
      <ion-img [src]="logo"></ion-img>
    </div>

    <div class="brand-exit">
      <ion-button class="exit-btn" fill="outline" color="medium" shape="round" (click)="goNotificaciones()"
        aria-label="Configuración de notificaciones">

        <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>

  <div class="sinConexion" *ngIf="sinConexion$ | async as aviso" role="status">
    <ion-icon name="cloud-offline-outline"></ion-icon> {{ aviso }}
  </div>

</div>

<ion-tabs class="main-tabs" [class.main-tabs--aviso]="!!(sinConexion$ | async)">
  <ion-tab-bar slot="bottom" class="main-tab-bar">

    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="resumen">
      <ion-icon name="analytics-outline"></ion-icon>
      <ion-label>Estación</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mapa">
      <ion-icon name="map-outline"></ion-icon>
      <ion-label>Mapa</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="alertas">
      <ion-icon name="warning-outline"></ion-icon>
      <ion-label>Alertas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="mas">
      <ion-icon name="apps-outline"></ion-icon>
      <ion-label>Más</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
